<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'Arène des Cogneurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: rowdy village fight-night, cheeky French humour
   IDEA: a fairground arena poster where your brawler is the headliner; events are street posters
   PICTURE: the brawler itself, huge, in a mustard spotlight; the arena or a Paris street as stage
   COLOUR and TYPE: mustard field, ink brown, hot red accent; event band in Paris navy; Lilita One + Nunito
   LAYOUT: hero band (sprite + identity), event band, opponents row, full-width arena */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#17110d);--ink:light-dark(#1d1310,#f6efe4);--mut:light-dark(#6b5a4e,#b9a998);--field:light-dark(#f4b41a,#33250b);--card:light-dark(#ffffff,#221912);--line:light-dark(#ecdcbc,#3d2e22);--red:#e23d28;--redD:#8f1f12;--teal:light-dark(#1f6f78,#5fc4cf);--spot:light-dark(#ffe28a,#5a4310);--navy:light-dark(#1f3a6b,#16294d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.logo,button,.pill,.vs,.result b,.opp b{font-family:"Lilita One",Impact,sans-serif;font-weight:400;letter-spacing:.01em}
h1{font-size:clamp(34px,6vw,52px);line-height:1.05;margin:0 0 8px;text-wrap:balance}
h2{font-size:28px;line-height:1.1;margin:0}
h3{font-size:20px;margin:18px 0 8px}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px max(5vw,16px);background:var(--ink);color:var(--bg)}
.logo{font-size:24px}
.hero{background:var(--field)}
.hgrid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.pedestal{position:relative;display:grid;place-items:center;min-height:340px;background:radial-gradient(closest-side,var(--spot),transparent)}
.pedestal .big{width:min(300px,70%)}
.pedestal .pets{display:flex;gap:6px;position:absolute;bottom:8px;right:6%}
.pedestal .pets div{width:70px}
.lead{font-size:17px;max-width:52ch}
label{font-weight:800;display:block;margin:16px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:3px solid var(--ink);background:var(--card);color:var(--ink);flex:1 1 220px;min-height:52px}
input:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button{font-size:19px;min-height:48px;padding:8px 20px;border:0;border-radius:12px;background:var(--red);color:#fff;box-shadow:0 4px 0 var(--redD);cursor:pointer;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--redD)}
button:disabled{background:#9a8e84;box-shadow:0 4px 0 #6b625b;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);font-size:16px}
.err{color:var(--red);font-weight:800;min-height:1.5em;margin:6px 0 0}
.sub{margin:0 0 14px;font-weight:700;opacity:.8}
.stat{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.5em;gap:10px;align-items:center;margin:5px 0;font-weight:700}
.stat .bar{height:12px;background:color-mix(in srgb,var(--ink) 14%,transparent);border-radius:6px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--ink);border-radius:6px}
.stat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.xp{height:16px;border-radius:8px;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden;margin:4px 0 2px}
.xp i{display:block;height:100%;background:var(--red)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.item{background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.3}
.item b{display:block;font-size:15px}.item small{color:var(--mut)}
.item.w{box-shadow:inset 0 -3px 0 var(--red)}.item.s{box-shadow:inset 0 -3px 0 var(--teal)}.item.p{box-shadow:inset 0 -3px 0 #8a5a2b}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pill{background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:99px;font-size:16px;white-space:nowrap}
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.opp{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:14px;align-items:center}
.opp .ms{background:radial-gradient(closest-side,var(--spot),transparent);border-radius:12px}
.opp b{font-size:22px;display:block;line-height:1.1}
.opp small{display:block;color:var(--mut);font-size:13px}
.opp button{grid-column:1/-1}
.hist{list-style:none;padding:0;margin:10px 0 24px;display:grid;gap:6px}
.hist li{display:flex;gap:10px;align-items:center;font-weight:700;flex-wrap:wrap}
.tag{font-family:"Lilita One";font-size:14px;padding:2px 10px;border-radius:99px;color:#fff;background:var(--teal)}.tag.l{background:#8c7d72}.tag.e{background:var(--navy)}
.empty{color:var(--mut)}
/* event band */
.event{background:var(--navy);color:#fff;position:relative}
.event::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:linear-gradient(90deg,#2b4fa3 0 33.3%,#fff 0 66.6%,#e23d28 0)}
.event .wrap{display:grid;gap:18px}
.event h2{font-size:clamp(30px,5vw,44px)}
.event .tags{display:flex;gap:8px;flex-wrap:wrap}
.event .tags span{background:#ffffff22;padding:4px 12px;border-radius:99px;font-weight:800;white-space:nowrap}
.event .tags .hot{background:#e23d28}
.event p{margin:0;max-width:62ch}
.event .note{font-size:14px;opacity:.8}
.gauge{display:grid;gap:6px}.gauge .gb{display:flex;height:22px;border-radius:11px;overflow:hidden;background:#ffffff22}.gauge .gb i{display:block;height:100%}.gauge .gl{display:flex;justify-content:space-between;gap:12px;font-weight:800;flex-wrap:wrap}.gauge small{opacity:.8;font-weight:700}
.camp .ud{display:inline-block;margin-top:6px;background:#e23d28;color:#fff;font-family:"Lilita One";font-size:14px;padding:2px 10px;border-radius:99px}
.troph{display:flex;gap:8px;flex-wrap:wrap}.troph span{background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.camps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.camp{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:#ffffff14;color:#fff;box-shadow:inset 0 0 0 2px #ffffff55;padding:14px;height:100%}
.camp b{display:block;font-size:26px;font-weight:400}.camp span{font-family:Nunito,sans-serif;font-size:15px;opacity:.85}
.event .pill{background:#fff;color:var(--navy)}
.event .opp{border-color:transparent}
/* fight */
.bars{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.hpb b{font-family:"Lilita One";font-weight:400;font-size:22px;display:block;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hpb .bar{height:18px;border-radius:9px;background:color-mix(in srgb,var(--ink) 15%,transparent);overflow:hidden;border:2px solid var(--ink)}
.hpb .bar i{display:block;height:100%;width:100%;background:#3fae4a;transition:width .3s}
.hpb.r{text-align:right}.hpb.r .bar{transform:scaleX(-1)}
.hpb span{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.vs{font-size:32px;color:var(--red)}
.arena{position:relative;aspect-ratio:16/8;border-radius:18px;overflow:hidden;border:4px solid var(--ink);background:linear-gradient(#3b2a20 0 44%,#7a5232 44% 48%,#5d3d24 48% 50%,transparent 50%),radial-gradient(ellipse at 50% 120%,#f6d596,#dca35e 75%,#c88c4b)}
.arena.paris{background:#8c8f94}
.decor{position:absolute;inset:0;width:100%;height:100%}
.crowd{position:absolute;inset:0 0 56% 0;width:100%;height:44%}
.f{position:absolute;bottom:12%;transform:translateX(-50%);width:14%}
.f.pet{bottom:4%;width:8%}.f.pet.ours{width:11%}.f.pet.bird{width:6%}
.f .spr{transform-origin:50% 95%;transition:transform .4s,opacity .4s,filter .4s}
.f.r .spr svg{transform:scaleX(-1)}
.f svg{display:block;width:100%;height:auto;overflow:visible}
.f.ko .spr{transform:rotate(-78deg) translateY(10%);opacity:.55;filter:grayscale(1)}
.f.r.ko .spr{transform:rotate(78deg) translateY(10%)}
.mini{height:6px;border-radius:3px;background:#0005;overflow:hidden;margin:0 15% 4px}.mini i{display:block;height:100%;width:100%;background:#3fae4a;transition:width .3s}
.num{position:absolute;transform:translateX(-50%);font-family:"Lilita One";font-size:clamp(18px,3vw,30px);color:#fff;-webkit-text-stroke:1.5px #1d1310;paint-order:stroke;pointer-events:none;white-space:nowrap}
.drop{position:absolute;width:5%;transform:translateX(-50%) rotate(100deg);opacity:.85}.drop svg,.proj svg{width:100%;height:auto;overflow:visible}.proj{position:absolute;width:6%;bottom:30%}
.num.c{color:#ffd23f;font-size:clamp(22px,4vw,40px)}.num.h{color:#7dff8a}.num.m{font-size:clamp(14px,2vw,20px)}
.result{position:absolute;inset:0;display:grid;place-items:center;background:#1d1310b3;color:#fff;text-align:center;padding:16px}
.result b{display:block;font-size:clamp(40px,8vw,72px);line-height:1}
.result p{margin:8px 0 16px;font-weight:700}
.ctl{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.log{list-style:none;padding:12px 14px;margin:0;background:var(--card);border:2px solid var(--line);border-radius:14px;height:190px;overflow:auto;font-size:15px}
.log li{padding:3px 0;border-bottom:1px dashed var(--line)}.log li:first-child{font-weight:800}
/* modal */
.modal{position:fixed;inset:0;background:#1d1310cc;display:grid;place-items:center;padding:16px;z-index:9}
.mbox{background:var(--field);border-radius:20px;padding:clamp(20px,4vw,36px);max-width:620px;width:100%;text-align:center;border:4px solid var(--ink)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:16px}
.choice{display:block;background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--ink);padding:18px;text-align:left;height:100%}
.choice b{display:block;font-size:24px;font-weight:400}
.choice span{font-family:Nunito,sans-serif;font-size:15px;color:var(--mut)}
.foot{text-align:center;color:var(--mut);font-size:13px;padding:20px}
.tabs{display:flex;gap:6px;margin:18px 0 0}.tab{background:transparent;color:var(--ink);box-shadow:inset 0 -3px 0 transparent;border-radius:10px 10px 0 0;font-size:18px}.tab.on{box-shadow:inset 0 -4px 0 var(--red)}
button.sm{min-height:36px;padding:4px 12px;font-size:14px}
.rank .tm{width:28px;display:inline-block}.kind{font-family:"Lilita One";font-size:12px;padding:1px 8px;border-radius:99px;background:#8c7d72;color:#fff;margin-right:4px}.kind.pl{background:var(--teal)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 40px}
.rank{list-style:none;padding:0;margin:10px 0;display:grid;gap:4px}.rank li{display:grid;grid-template-columns:2em 28px minmax(0,1fr) auto;gap:10px;align-items:center;font-weight:700}.rank li.me{background:color-mix(in srgb,var(--field) 35%,transparent);border-radius:8px}.rank .rk{text-align:right;color:var(--mut)}.rank b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.d{background:#7b3f99}.note2{font-size:14px;opacity:.8;max-width:52ch}
#who{display:flex;gap:10px;align-items:center;font-weight:800}#who .ghost{color:var(--bg);box-shadow:inset 0 0 0 2px var(--bg)}
.invite{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:700;max-width:52ch}
.pupils{background:color-mix(in srgb,var(--field) 22%,var(--bg))}.pupils p{max-width:70ch}
.plist{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.plist li{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px}
@media(max-width:700px){#who span{display:none}.hgrid{grid-template-columns:minmax(0,1fr)}.pedestal{min-height:260px;order:-1}.cell .pedestal{order:0}.arena{aspect-ratio:16/11}.f{width:20%}.f.pet{width:11%}.f.pet.ours{width:15%}.f.pet.bird{width:8%}.vs{font-size:22px}.hpb b{font-size:17px}.camp{grid-template-columns:80px minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.f .spr,.hpb .bar i{transition:none}}
</style>
</head>
<body>
<header class="top"><span class="logo">Cogneurs</span><span id="who"></span></header>
<main id="app"></main>
<p class="foot">Jeu original inspiré des auto-battlers à l'ancienne. Tous les visuels sont dessinés en code.</p>
<script src="/engine.js"></script>

{

 const shirt=pol?'#26355a':L.shirt,pants=pol?'#1d2740':L.pants;
 let hair=[`<path d="M41 30L40 14L47 21L50 8L56 18L62 6L65 18L72 10L74 22L80 18L79 30Q60 16 41 30Z" fill="${hc}"/>`,
  `<path d="M54 18Q60 0 66 18Q60 14 54 18Z" fill="${hc}"/><rect x="55" y="6" width="10" height="14" rx="4" fill="${hc}"/>`,

 return `<section class="band pupils"><div class="wrap"><div class="h2row"><h2>Mes élèves</h2><span class="pill">${V.pupils.length} élève${V.pupils.length>1?'s':''}</span></div>
 <p>Partage ton lien : chaque ami qui crée son cogneur avec devient ton élève. Il reçoit ${V.pupilBonus} combats bonus le premier jour, et toi tu gagnes de l\u2019XP quand il progresse (${rw}).</p>
 <div class="row"><input id="plink" readonly value="${esc(link)}" aria-label="Ton lien de maître"><button id="cplink">Copier le lien</button><button id="shlink" class="ghost">Partager</button></div><p class="note2" id="cpmsg" role="status"></p>
 ${V.pupils.length?`<ul class="plist">${V.pupils.map(p=>`<li><b>${esc(p.name)}</b><span>niv. ${p.level}</span></li>`).join('')}</ul>`:'<p class="empty">Pas encore d\u2019élève. Envoie ton lien à tes amis !</p>'}</div></section>`}
function renderCell(){setWho();const b=V.brute,n=V.need;
 app.innerHTML=`<section class="hero band cell"><div class="hgrid"><div class="pedestal"><div class="big">${sprite(b.look,b.weapons[0])}</div><div class="pets">${b.pets.map(p=>`<div>${petSvg(p)}</div>`).join('')}</div></div>
 <div><h1>${esc(b.name)}</h1><p class="sub">Niveau ${b.level} · ${b.wins} victoire${b.wins>1?'s':''} · ${b.losses} défaite${b.losses>1?'s':''}${V.master?` · élève de ${esc(V.master.name)}`:''}${V.pupils.length?` · ${V.pupils.length} élève${V.pupils.length>1?'s':''}`:''}</p>
 <div class="stat"><span>Expérience</span><div class="xp"><i style="width:${V.xp/n*100}%"></i></div><span>${V.xp}/${n}</span></div>
 ${statRows(b)}<h3>Arsenal</h3><div class="items">${items(b)}</div>${V.trophies&&V.trophies.length?`<h3>Événements</h3><div class="troph">${V.trophies.map(t=>`<span>${t.won?'Victoire':'Participation'} · ${esc(t.title)} · ${t.camp==='manif'?'Manifestant·e':'Forces de l\u2019ordre'}</span>`).join('')}</div>`:''}</div></div></section>
 ${eventBand()}
 <section class="band"><div class="wrap"><div class="h2row"><h2>Arène classique</h2><span class="pill">${V.fightsLeft} combat${V.fightsLeft>1?'s':''} restant${V.fightsLeft>1?'s':''} aujourd'hui</span></div>
 <p class="err" id="ferr"></p>
 <div class="opps">${V.opps.map((o,i)=>o?oppCard(o,i,'ar',V.fightsLeft&&!V.pending):'').join('')}</div>
 ${V.fightsLeft?'':'<p class="empty">Ton cogneur est épuisé. Les combats reviennent demain (minuit, heure de Paris).</p>'}
 <div class="two"><div><h3>Derniers combats</h3><ul class="hist">${V.hist.length?V.hist.map(h=>`<li><span class="tag ${h.won?'':'l'}">${h.won?'Victoire':'Défaite'}</span>${h.ev?'<span class="tag e">Manif</span>':''}${h.mine?'contre':'<span class="tag d">Défense</span> attaqué par'} ${esc(h.opp)} (niv. ${h.lvl})${h.mine?` · +${h.xp} XP`:''} <button class="ghost sm" data-r="${h.id}">Revoir</button></li>`).join(''):'<li class="empty">Aucun combat pour l’instant.</li>'}</ul></div>
 <div><h3>Classement</h3><ol class="rank" id="top"><li class="empty">Chargement…</li></ol><h3>Meilleurs maîtres</h3><ol class="rank" id="topm"><li class="empty">Chargement…</li></ol></div></div></div></section>
 ${pupilBand()}
 ${V.pending?`<div class="modal"><div class="mbox"><h2>Niveau ${b.level} !</h2><p>Choisis ce que ${esc(b.name)} apprend :</p><div class="choices">${V.pending.map((o,i)=>{const[t,d]=describe(o,b);return `<button class="choice" data-c="${i}"><b>${t}</b><span>${d}</span></button>`}).join('')}</div></div></div>`:''}`;
 app.querySelectorAll('[data-o]').forEach(x=>x.addEventListener('click',()=>fight(x.dataset.k,+x.dataset.o,x)));
 app.querySelectorAll('[data-r]').forEach(x=>x.addEventListener('click',async()=>{try{play(await api('GET','/api/replay?id='+x.dataset.r))}catch(er){fail('#ferr',er)}}));
 app.querySelectorAll('[data-camp]').forEach(x=>x.addEventListener('click',async()=>{try{V=await api('POST','/api/camp',{camp:x.dataset.camp});renderCell()}catch(er){fail('#cerr',er)}}));
 app.querySelectorAll('[data-c]').forEach(x=>x.addEventListener('click',async()=>{try{V=await api('POST','/api/levelup',{choice:+x.dataset.c});renderCell()}catch(er){alertBox(er.message)}}));
 api('GET','/api/top').then(({brutes:rows,masters})=>{const em=$('#topm');if(em)em.innerHTML=masters.map((r,i)=>`<li class="${r.name===b.name?'me':''}"><span class="rk">${i+1}</span><span class="tm">${sprite(r.look,r.weapon)}</span><b>${esc(r.name)}</b><span>${r.pupils} élève${r.pupils>1?'s':''}</span></li>`).join('')||'<li class="empty">Personne n\u2019a encore d\u2019élève : sois le premier !</li>';const el=$('#top');if(el)el.innerHTML=rows.map((r,i)=>`<li class="${r.name===b.name?'me':''}"><span class="rk">${i+1}</span><span class="tm">${sprite(r.look,r.weapon)}</span><b>${esc(r.name)}</b><span>niv. ${r.level}</span></li>`).join('')||'<li class="empty">Personne encore.</li>'}).catch(()=>{});
 if(MASTER&&!renderCell.seen){renderCell.seen=1;history.replaceState(null,'',location.pathname);
  alertBox(MASTER.toLowerCase()===b.name.toLowerCase()?['C\u2019est ton lien d\u2019invitation : il fonctionne !','Comme tu es déjà connecté, il t\u2019amène simplement à ta cellule. Tes amis, eux, verront l\u2019invitation et deviendront tes élèves en s\u2019inscrivant. Pour voir ce qu\u2019ils verront, ouvre le lien dans une fenêtre de navigation privée.']:[`Ce lien d\u2019invitation de ${MASTER} sert aux nouveaux joueurs.`,'Tu as déjà un cogneur, donc il ne peut pas devenir élève.'])}
 if(V.news){alertBox(V.news);V.news=null}
 const cp=$('#cplink'),pl=$('#plink'),sh=$('#shlink');
 const copyLink=async()=>{const v=pl.value;let ok=false;
  try{await navigator.clipboard.writeText(v);ok=true}catch(e){}
  if(!ok){pl.focus();pl.select();pl.setSelectionRange(0,v.length);try{ok=document.execCommand('copy')}catch(e){}}
  $('#cpmsg').textContent=ok?`Copié : ${v}`:'La copie automatique est bloquée ici : le lien est sélectionné, fais Ctrl+C (ou Cmd+C).';};
 if(cp)cp.addEventListener('click',copyLink);
 if(pl)pl.addEventListener('focus',()=>pl.select());
 if(sh){if(navigator.share)sh.addEventListener('click',()=>navigator.share({title:'L\u2019Arène des Cogneurs',text:'Viens être mon élève dans l\u2019Arène des Cogneurs !',url:pl.value}).catch(()=>{}));else sh.remove()}
 scrollTo(0,0)}
function alertBox(msg){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="mbox">${[].concat(msg).map(m=>`<p>${esc(m)}</p>`).join('')}<button>OK</button></div>`;document.body.append(d);d.querySelector('button').addEventListener('click',()=>d.remove())}
async function fight(kind,idx,btn){if(btn)btn.disabled=true;
 try{play(await api('POST','/api/fight',{kind,idx}))}catch(er){fail(kind==='ev'?'#cerr':'#ferr',er);if(btn)btn.disabled=false;if(er.status===409||er.status===429){V=await api('GET','/api/me');renderCell()}}}

/* ---------- combat (rejoué à partir de la graine envoyée par le serveur) ---------- */
function play(data){const{A,B,seed,won,gain}=data,isEv=data.ev,{F,ev}=simulate(A,B,RNG(seed));
 app.innerHTML=`<section class="band"><div class="wrap"><div class="bars"><div class="hpb"><b>${esc(A.name)}</b><div class="bar"><i id="hp0"></i></div><span id="hv0"></span></div><div class="vs">VS</div><div class="hpb r"><b>${esc(B.name)}</b><div class="bar"><i id="hp1"></i></div><span id="hv1"></span></div></div>
 <div class="arena ${isEv?'paris':''}" id="arena">${isEv?paris:crowd}${F.map(f=>`<div class="f ${f.kind} ${f.kind==='pet'?petCls(f.pet,f.b.camp||'classic'):''} ${f.side?'r':''}" id="f${f.i}" style="left:${f.x}%">${f.kind==='pet'?'<div class="mini"><i></i></div>':''}<div class="spr">${f.kind==='brute'?sprite(f.b.look,null,f.b.camp):petSvg(f.pet,f.b.camp||'classic')}</div></div>`).join('')}</div>
 <div class="ctl"><button id="sp" class="ghost">Vitesse ×1</button><button id="skip" class="ghost">Passer</button></div><ol class="log" id="log"></ol></div></section>`;
 const arena=$('#arena'),log=$('#log'),el=i=>$('#f'+i),nm=f=>esc(f.kind==='pet'?`${f.name} de ${f.owner}`:f.name),wn=(f,w)=>T(f.b).w[w];
 let speed=1,skip=false;const D=ms=>ms/speed,sleep=ms=>skip?Promise.resolve():new Promise(r=>setTimeout(r,D(ms)));
 $('#sp').addEventListener('click',e=>{speed=speed>=4?1:speed*2;e.target.textContent='Vitesse ×'+speed});
 $('#skip').addEventListener('click',()=>{skip=true});
 const setHp=(f,hp)=>{const p=hp/f.max*100+'%';if(f.kind==='brute'){$('#hp'+f.side).style.width=p;$('#hv'+f.side).textContent=`${hp} / ${f.max} PV`}else el(f.i).querySelector('.mini i').style.width=p};
 F.forEach(f=>setHp(f,f.max));
 const say=t=>{const li=document.createElement('li');li.innerHTML=t;log.prepend(li)};
 const float=(f,txt,cls)=>{if(skip)return;const d=document.createElement('div');d.className='num '+cls;d.textContent=txt;d.style.left=f.x+'%';d.style.bottom=f.kind==='brute'?'46%':'22%';arena.append(d);
  d.animate([{transform:'translate(-50%,0)',opacity:1},{transform:'translate(-50%,-50px)',opacity:0}],{duration:D(900),easing:'ease-out'}).finished.then(()=>d.remove(),()=>d.remove())};
 const mv=(e,frames,ms)=>skip?Promise.resolve():e.animate(frames.map(dx=>({transform:`translateX(calc(-50% + ${dx}px))`})),{duration:D(ms),easing:'ease-in-out'}).finished.catch(()=>{});
 const wsvg=(f,w)=>`<svg viewBox="-30 -80 60 90">${((WSV[f.b.camp]||WSV.classic)[w])||WSV.classic[w]}</svg>`;
 const drop=(f,w,x)=>{const d=document.createElement('div');d.className='drop';d.style.left=x+'%';d.style.bottom=(3+Math.random()*5)+'%';d.innerHTML=wsvg(f,w);arena.insertBefore(d,arena.querySelector('.f'))};
 const flash=e=>{if(!skip)e.querySelector('.spr').animate([{filter:'brightness(2.6) saturate(0)'},{filter:'none'}],{duration:D(260)})};
 async function attack(a,b,react){const dx=(b.x-a.x-(a.side?-9:9))*arena.clientWidth/100;const go=mv(el(a.i),[0,dx,dx,0],520);await sleep(230);react();await go}
 async function show(e){const a=F[e.a],b=F[e.b];
  if(e.t==='weapon'){if(e.old)drop(a,e.old,a.x);el(a.i).querySelector('.spr').innerHTML=sprite(a.b.look,e.w,a.b.camp);say(e.old?`${nm(a)} jette ${wn(a,e.old)} et dégaine : ${wn(a,e.w)}.`:`${nm(a)} dégaine : ${wn(a,e.w)}.`);await sleep(350)}
  else if(e.t==='throw'){el(a.i).querySelector('.spr').innerHTML=sprite(a.b.look,null,a.b.camp);
   if(!skip){const p=document.createElement('div');p.className='proj';p.innerHTML=wsvg(a,e.w);arena.append(p);
    await p.animate([{left:a.x+'%',transform:'translateX(-50%) rotate(0)'},{left:b.x+'%',transform:`translateX(-50%) rotate(${a.side?-720:720}deg)`}],{duration:D(450),easing:'ease-in'}).finished.catch(()=>{});p.remove()}
   drop(a,e.w,b.x+(a.side?6:-6));
   if(e.miss){float(b,'Raté','m');say(`${nm(a)} lance ${wn(a,e.w)} sur ${nm(b)}… raté !`)}
   else{setHp(b,e.hp);flash(el(b.i));float(b,'−'+e.dmg,'');say(`${nm(a)} lance ${wn(a,e.w)} sur ${nm(b)} : −${e.dmg}`)}await sleep(200)}
  else if(e.t==='disarm'){el(b.i).querySelector('.spr').innerHTML=sprite(b.b.look,null,b.b.camp);drop(b,e.w,b.x+(b.side?8:-8));float(b,'Désarmé !','m');say(`${nm(a)} désarme ${nm(b)}, qui perd ${wn(b,e.w)} !`);await sleep(300)}
  else if(e.t==='hit'){await attack(a,b,()=>{setHp(b,e.hp);flash(el(b.i));mv(el(b.i),[0,b.side?10:-10,b.side?-4:4,0],220);float(b,'−'+e.dmg,e.crit?'c':'')});say(`${nm(a)} frappe ${nm(b)}${e.w?' ('+wn(a,e.w)+')':''} : −${e.dmg}${e.crit?' — coup critique !':''}`);await sleep(120)}
  else if(e.t==='dodge'){await attack(a,b,()=>{mv(el(b.i),[0,b.side?40:-40,0],300);float(b,'Esquive','m')});say(`${nm(b)} esquive l'attaque de ${nm(a)}.`);await sleep(100)}
  else if(e.t==='block'){await attack(a,b,()=>float(b,'Bloqué','m'));say(`${nm(b)} bloque le coup de ${nm(a)} !`);await sleep(100)}
  else if(e.t==='counter'){say(`${nm(a)} contre-attaque !`);float(a,'Riposte !','m');await sleep(150)}
  else if(e.t==='frenzy'){say(`${nm(a)} : ${T(a.b).sk.frenesie} !`);float(a,'Encore !','m');await sleep(150)}
  else if(e.t==='heal'){setHp(a,e.hp);float(a,'+'+e.amt,'h');say(`${nm(a)} : ${T(a.b).sk.souffle}, +${e.amt} PV.`);await sleep(500)}
  else if(e.t==='ko'){const x=el(a.i);x.getAnimations().forEach(n=>n.cancel());x.classList.add('ko');say(`<b>${nm(a)} ${a.kind==='brute'?T(a.b).ko:'est K.O.'}</b>`);await sleep(500)}
  else if(e.t==='end'){const r=document.createElement('div');r.className='result';
   const txt=data.replay?`Vainqueur : ${esc(won?A.name:B.name)}`:`+${gain} XP${isEv?` (bonus ×${data.mult})`:''}${data.leveled?' · Niveau supérieur ! Un bonus t’attend.':''}`;
   r.innerHTML=`<div><b>${data.replay?'Rediffusion':won?'Victoire !':'Défaite…'}</b><p>${txt}</p><button id="back">Retour à la cellule</button></div>`;arena.append(r);
   $('#back').addEventListener('click',async()=>{try{V=await api('GET','/api/me')}catch(er){}route()})}}
 scrollTo(0,0);(async()=>{for(const e of ev)await show(e)})()}

function route(){if(!V)return renderAuth();if(!V.brute)return renderCreate();renderCell()}
api('GET','/api/me').then(v=>{V=v;route()}).catch(()=>renderAuth());
}
</script>
</body>
</html>
